version: 2.1
jobs:
  # Playwright end-to-end suite for smarthome-ui, running against the dev server
  # with a fully mocked backend (see smarthome-ui/vue_migration.md, phase 0).
  # It gates the image build so a broken UI is never published.
  test_ui:
    docker:
      # Keep this tag in step with the @playwright/test version in
      # smarthome-ui/package.json - the browsers are baked into the image.
      - image: mcr.microsoft.com/playwright:v1.62.1-noble
    resource_class: medium
    working_directory: ~/project/smarthome-ui
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: npm ci --legacy-peer-deps
      - run:
          name: Run end-to-end tests
          command: npm run e2e
      - store_artifacts:
          path: ~/project/smarthome-ui/e2e-report
          destination: e2e-report
      - store_artifacts:
          path: ~/project/smarthome-ui/test-results
          destination: test-results
  build_ui:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run: git submodule sync
      - run: git submodule update --init
      - run: |
          docker build --platform linux/arm64 --build-arg GIT_VERSION=$CIRCLE_SHA1 -t cecchisandrone/smarthome-ui:latest ./smarthome-ui
          docker login -u $DOCKER_REGISTRY_USERNAME -p $DOCKER_REGISTRY_PASSWORD
          docker push cecchisandrone/smarthome-ui:latest
      - persist_to_workspace:
          root: /home/circleci
          paths:
            - project/*
  build_server:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    working_directory: /tmp/project/smarthome-server
    steps:
      - attach_workspace:
          at: /tmp
      - run: |
          docker login -u $DOCKER_REGISTRY_USERNAME -p $DOCKER_REGISTRY_PASSWORD
          docker buildx build --platform linux/arm/v7 -t cecchisandrone/smarthome-server:latest --push .
  build_images:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    working_directory: /tmp/project
    steps:
      - attach_workspace:
          at: /tmp
      - run: |
          docker login -u $DOCKER_REGISTRY_USERNAME -p $DOCKER_REGISTRY_PASSWORD
          docker buildx build --platform linux/arm/v7 -t cecchisandrone/prometheus:latest --push ./prometheus
          docker buildx build --platform linux/arm/v7 -t cecchisandrone/alertmanager:latest --push ./alertmanager
          docker buildx build --platform linux/arm/v7 -t cecchisandrone/blackbox-exporter:latest --push ./blackbox-exporter
  deploy:
    machine:
      image: ubuntu-2204:current
    working_directory: /tmp/project
    steps:
      - attach_workspace:
          at: /tmp
      - run:
          command: scp -v -o StrictHostKeyChecking=no -P $SMARTHOME_SSH_PORT docker-compose.yml $SMARTHOME_USER@$SMARTHOME_SSH_HOST:/home/$SMARTHOME_USER
      - run:
          command: ssh -o StrictHostKeyChecking=no -l $SMARTHOME_USER $SMARTHOME_SSH_HOST -p $SMARTHOME_SSH_PORT "mv docker-compose.yml docker-compose-smarthome.yml && docker compose -f docker-compose-smarthome.yml -p pi stop && docker compose -f docker-compose-smarthome.yml pull && docker compose -f docker-compose-smarthome.yml -p pi up -d"
          no_output_timeout: 30m
workflows:
  build-and-deploy:
    jobs:
      - test_ui
      - build_ui:
          requires:
            - test_ui
      - build_server:
          requires:
            - build_ui
      - build_images:
          requires:
            - build_ui
      - deploy:
          filters:
            branches:
              only: master
          requires:
            - build_ui
            - build_server
            - build_images
